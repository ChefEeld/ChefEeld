<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef Eel'd</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #ffffff;
        color: #333;
        font-family: "Courier New", Courier, monospace;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      /* Initial centered layout (login screen) */
      body:not(.gallery-view) {
        height: calc(var(--vh) * 100);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
        background: #e8e8e8; /* soft grey-white classic Mac desktop */
      }

      /* Gallery view layout */
      body.gallery-view {
        background: #ffffff;
      }

      h1 {
        display: none;
      }

      /* ===== Retro Mac OS Login Window ===== */
      .login-window {
        width: 360px;
        max-width: 90vw;
        background: #dcdcdc;
        border: 1px solid #000;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .login-titlebar {
        height: 20px;
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 6px;
        background: repeating-linear-gradient(
          to bottom,
          #ffffff 0px,
          #ffffff 2px,
          #dcdcdc 2px,
          #dcdcdc 4px
        );
        border-bottom: 1px solid #000;
      }

      .login-titlebar .close-box {
        width: 12px;
        height: 12px;
        border: 1px solid #000;
        background: #dcdcdc;
        flex-shrink: 0;
      }

      .login-titlebar .title-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #dcdcdc;
        padding: 0 8px;
        font-size: 0.8rem;
        font-weight: bold;
        color: #000;
        white-space: nowrap;
      }

      .login-body {
        padding: 20px 22px 22px;
        background: #f4f4f4;
      }

      .login-body label {
        display: block;
        font-size: 0.8rem;
        color: #000;
        margin-bottom: 4px;
        margin-top: 12px;
      }

      .login-body label:first-child {
        margin-top: 0;
      }

      .login-body input[type="text"],
      .login-body input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.85rem;
        border: 1px solid #000;
        border-radius: 3px;
        background: #fff;
        outline: none;
      }

      .login-buttons {
        display: flex;
        justify-content: flex-end;
        margin-top: 22px;
      }

      .win-button {
        padding: 6px 22px;
        font-size: 0.85rem;
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: linear-gradient(#fdfdfd, #e2e2e2);
        color: #000;
        border: 1px solid #000;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.6) inset;
        transition: background 0.1s;
      }

      .win-button:hover {
        background: linear-gradient(#ffffff, #ececec);
      }

      .win-button:active {
        background: linear-gradient(#dcdcdc, #cacaca);
      }

      .gallery {
        display: none;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      body.gallery-view .gallery {
        display: block;
      }

      body.gallery-view .login-window {
        display: none;
      }

      .gallery-item {
        margin-bottom: 50px;
        text-align: center;
      }

      .gallery-item img {
        width: 100%;
        max-width: 100%;
        height: auto;
        border-radius: 4px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        transition: transform 0.6s;
      }

      .gallery-item img:hover {
        transform: translateY(-5px);
      }

      .image-caption {
        margin-top: 5px;
        font-size: 1rem;
        color: #666;
        font-style: italic;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        line-height: 1.4;
        text-align: right;
      }

      /* ===== Mac OS style fixed header (gallery view) ===== */
      .site-titlebar {
        display: none;
      }

      body.gallery-view .site-titlebar {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 26px;
        align-items: center;
        padding: 0 10px;
        z-index: 100;
        background: repeating-linear-gradient(
          to bottom,
          #ffffff 0px,
          #ffffff 2px,
          #dcdcdc 2px,
          #dcdcdc 4px
        );
        border-bottom: 1px solid #000;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      }

      .site-titlebar .close-box {
        width: 13px;
        height: 13px;
        border: 1px solid #000;
        background: #dcdcdc;
        flex-shrink: 0;
      }

      .site-titlebar .title-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #dcdcdc;
        padding: 0 10px;
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.9rem;
        font-weight: bold;
        color: #000;
        white-space: nowrap;
      }

      body.gallery-view {
        padding-top: 46px;
      }

      @media (max-width: 768px) {
        body.gallery-view {
          padding-top: 40px;
        }
        .gallery {
          padding: 10px;
        }
        .gallery-item {
          margin-bottom: 40px;
        }
        .image-caption {
          font-size: 1rem;
        }
        .site-titlebar {
          height: 22px;
        }
        .site-titlebar .title-label {
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="site-titlebar">
      <span class="close-box"></span>
      <span class="title-label">Chef Eel'd</span>
    </div>

    <div class="login-window">
      <div class="login-titlebar">
        <span class="close-box"></span>
        <span class="title-label">Login</span>
      </div>
      <div class="login-body">
        <label for="username">Username:</label>
        <input type="text" id="username" value="Chefeeld" />

        <label for="password">Password:</label>
        <input type="password" id="password" value="GooseyGander" />

        <div class="login-buttons">
          <button class="win-button" onclick="showGallery()">Login</button>
        </div>
      </div>
    </div>
    <div class="gallery">
      <div class="gallery-item first">
        <img
          data-src="Images/San1.jpg"
          alt="Plated meal"
        />
        <div class="image-caption">
          Santorini, 2018. Fujicolor 200.
        </div>
      </div>
      <div class="gallery-item">
        <img
          data-src="Images/San3.jpg"
          alt="Fresh ingredients"
        />
        <div class="image-caption">
          Santorini, 2018. Fujicolor 200.
        </div>
      </div>
      <div class="gallery-item">
        <img
          data-src="Images/San2.jpg"
          alt="Food preparation"
        />
        <div class="image-caption">
          Santorini, 2018. Fujicolor 200.
        </div>
      </div>
      <div class="gallery-item">
        <img
          data-src="Images/San4.jpg"
          alt="Delicious food"
        />
        <div class="image-caption">
          Santorini, 2018. Fujicolor 200.
        </div>
      </div>
    </div>

    <script>
      function setViewportHeight() {
        // Calculate 1% of the viewport height
        const vh = window.innerHeight * 0.01;
        // Set a custom property on the root
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }

      // Set on load
      window.addEventListener('load', setViewportHeight);
      // Update on resize/orientation change
      window.addEventListener('resize', setViewportHeight);

      function showGallery() {
        // Fade out the entire page
        document.body.style.opacity = "0";

        setTimeout(() => {
          // Lazy-load images
          const images = document.querySelectorAll("img[data-src]");
          images.forEach((img) => {
            if (!img.src) {
              img.src = img.dataset.src;
            }
          });

          // Switch layout
          document.body.classList.add("gallery-view");

          // Fade page back in
          document.body.style.opacity = "1";
        }, 300);
      }
    </script>
  </body>
</html>
