<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef Eel'd</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #ffffff;
        color: #333;
        font-family: "Courier New", Courier, monospace;
        opacity: 1;
        transition: opacity 0.6s ease;
      }

      /* Initial centered layout (login screen) */
      body:not(.gallery-view) {
        height: calc(var(--vh) * 100);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
        background: #e8e8e8; /* soft grey-white classic Mac desktop */
      }

      /* Gallery view layout */
      body.gallery-view {
        background: #ffffff;
      }

      h1 {
        display: none;
      }

      /* ===== Retro Mac OS Login Window ===== */
      .login-window {
        width: 360px;
        max-width: 90vw;
        background: #dcdcdc;
        border: 1px solid #000;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }

      .login-titlebar {
        height: 20px;
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 6px;
        background: repeating-linear-gradient(
          to bottom,
          #ffffff 0px,
          #ffffff 2px,
          #dcdcdc 2px,
          #dcdcdc 4px
        );
        border-bottom: 1px solid #000;
      }

      .login-titlebar .close-box {
        width: 12px;
        height: 12px;
        border: 1px solid #000;
        background: #dcdcdc;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        line-height: 1;
        color: #000;
        cursor: default;
      }


      .login-titlebar .title-label {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #dcdcdc;
        padding: 0 8px;
        font-size: 0.8rem;
        font-weight: bold;
        color: #000;
        white-space: nowrap;
      }

      .login-body {
        padding: 20px 22px 22px;
        background: #f4f4f4;
      }

      .login-body label {
        display: block;
        font-size: 0.8rem;
        color: #000;
        margin-bottom: 4px;
        margin-top: 12px;
      }

      .login-body label:first-child {
        margin-top: 0;
      }

      .login-body input[type="text"],
      .login-body input[type="password"] {
        width: 100%;
        padding: 6px 8px;
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.85rem;
        border: 1px solid #000;
        border-radius: 3px;
        background: #fff;
        outline: none;
      }

      .login-body input.password-visible {
        font-style: italic;
        font-size: 0.78rem;
      }

      .login-buttons {
        display: flex;
        justify-content: flex-end;
        margin-top: 22px;
      }

      .win-button {
        padding: 5px 16px;
        font-size: 0.78rem;
        font-weight: bold;
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        background: #d8d8d8;
        color: #000;
        border: 1px solid #000;
        border-radius: 4px;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7),
                    inset 0 -2px 0 rgba(0, 0, 0, 0.15);
        transition: background 0.1s, box-shadow 0.1s;
      }

      .win-button:hover {
        background: #e2e2e2;
      }

      .win-button:active {
        background: #bcbcbc;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      }

      .gallery {
        display: none;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
      }

      body.gallery-view .gallery {
        display: block;
      }

      body.gallery-view .login-window {
        display: none;
      }

      .gallery-item {
        margin-bottom: 40px;
        text-align: center;
      }

      /* ===== Retro Mac dialog box around each photo ===== */
      .photo-window {
        display: inline-block;
        width: 100%;
        max-width: 640px;
        text-align: left;
        background: #dcdcdc;
        border: 1px solid #000;
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.25);
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        transition: transform 0.6s;
      }

      .photo-window:hover {
        transform: translateY(-5px);
      }

      .photo-titlebar {
        height: 20px;
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 6px;
        background: repeating-linear-gradient(
          to bottom,
          #ffffff 0px,
          #ffffff 2px,
          #dcdcdc 2px,
          #dcdcdc 4px
        );
        border-bottom: 1px solid #000;
      }

      .photo-titlebar .close-box {
        width: 12px;
        height: 12px;
        border: 1px solid #000;
        background: #dcdcdc;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        line-height: 1;
        color: #000;
        cursor: default;
      }

      .photo-titlebar .photo-title {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #dcdcdc;
        padding: 0 8px;
        font-size: 0.8rem;
        font-weight: bold;
        color: #000;
        white-space: nowrap;
        max-width: 70%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .photo-body {
        background: #f4f4f4;
        padding: 10px;
      }

      .photo-body img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #000;
      }

      .photo-caption {
        margin-top: 8px;
        font-size: 0.75rem;
        font-style: italic;
        color: #444;
        text-align: right;
        line-height: 1.4;
      }

      .close-box {
        width: 14px;
        height: 14px;
        border: 1px solid #000;
        background: #dcdcdc;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        line-height: 12px;
        padding: 0;
        color: #000;
    }


      /* ===== Mac OS style system menu bar (gallery view) ===== */
      .site-menubar {
        display: none;
      }

      body.gallery-view .site-menubar {
        display: flex;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 24px;
        align-items: center;
        padding: 0 12px;
        gap: 20px;
        z-index: 100;
        background: #e4e4e4;
        border-bottom: 1px solid #000;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
        font-family: "Geneva", "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 0.8rem;
        color: #000;
      }

      .site-menubar .apple-icon {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      .site-menubar .menu-item {
        white-space: nowrap;
        cursor: default;
      }

      .site-menubar .menu-item.brand {
        font-weight: bold;
      }

      .site-menubar .menu-spacer {
        flex: 1;
      }

      .site-menubar .menu-clock {
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }

      body.gallery-view {
        padding-top: 44px;
      }

      @media (max-width: 768px) {
        body.gallery-view {
          padding-top: 38px;
        }
        .gallery {
          padding: 10px;
        }
        .gallery-item {
          margin-bottom: 30px;
        }
        .photo-caption {
          font-size: 0.7rem;
        }
        .photo-titlebar .photo-title {
          font-size: 0.7rem;
        }
        .site-menubar {
          height: 20px;
          gap: 12px;
          font-size: 0.65rem;
          padding: 0 8px;
        }
        .site-menubar .apple-icon {
          width: 12px;
          height: 12px;
        }
        .site-menubar .menu-item:not(.brand):not(:first-of-type) {
          display: none; /* hide extra decorative menu items on small screens */
        }
      }
    </style>
  </head>
  <body>
    <div class="site-menubar">
      <svg class="apple-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="#000">
        <path d="M22.6 17.2c0-3.6 2.9-5.3 3.1-5.5-1.7-2.4-4.3-2.8-5.2-2.8-2.2-.2-4.3 1.3-5.4 1.3-1.1 0-2.9-1.3-4.7-1.2-2.4 0-4.6 1.4-5.9 3.5-2.5 4.3-.6 10.7 1.8 14.2 1.2 1.7 2.6 3.7 4.4 3.6 1.8-.1 2.5-1.1 4.6-1.1 2.1 0 2.7 1.1 4.6 1.1 1.9 0 3.1-1.7 4.3-3.4 1.4-2 1.9-3.9 2-4-0.1 0-3.6-1.4-3.6-5.7zM19.3 6.8c1-1.2 1.6-2.8 1.4-4.5-1.4.1-3.1 1-4.1 2.1-.9 1-1.7 2.7-1.5 4.3 1.6.1 3.2-.8 4.2-1.9z"/>
      </svg>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item brand">Chef Eel'd</span>
      <span class="menu-item">Help</span>
      <span class="menu-spacer"></span>
      <span class="menu-clock" id="menuClock">12:00:00 PM</span>
    </div>

    <div class="login-window">
      <div class="login-titlebar">
        <span class="close-box">&times;</span>
        <span class="title-label">Login</span>
      </div>
      <div class="login-body">
        <label for="username">Username:</label>
        <input type="text" id="username" value="Chefeeld" />

        <label for="password">Password:</label>
        <input type="text" id="password" class="password-visible" value="GooseyGander" />

        <div class="login-buttons">
          <button class="win-button" onclick="showGallery()">Login</button>
        </div>
      </div>
    </div>
    <div class="gallery">
      <div class="gallery-item first">
        <div class="photo-window">
          <div class="photo-titlebar">
            <span class="close-box">&times;</span>
            <span class="photo-title">SeanBoonTower.jpg</span>
          </div>
          <div class="photo-body">
            <img data-src="Images/Sheff1.webp" alt="Abandoned building in Sheffield" />
            <div class="photo-caption"></div>
          </div>
        </div>
      </div>
       <div class="gallery-item">
        <div class="photo-window">
          <div class="photo-titlebar">
            <span class="close-box">&times;</span>
            <span class="photo-title">LeanLeaningTree.jpg</span>
          </div>
          <div class="photo-body">
            <img data-src="Images/LeaningTree.jpg" alt="Small file sized leaning tree" />
            <div class="photo-caption"></div>
          </div>
        </div>
      </div>
      <div class="gallery-item">
        <div class="photo-window">
          <div class="photo-titlebar">
            <span class="close-box">&times;</span>
            <span class="photo-title">LeanLeaningTree.jpg</span>
          </div>
          <div class="photo-body">
            <img data-src="Images/FatLeaningTree.jpg" alt="Small file sized leaning tree" />
            <div class="photo-caption"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ===== Password phrase randomizer =====
      // Add or remove phrases from this list — one will be picked at random
      // each time the page loads and shown in the password field.
      const passwordPhrases = [
        "I'mFeelingNosey",
        "I'llHaveAGooseyGander",
        "ThisSeemsPretencious",
        "CapitalismIstheUltimateSin",
        "JetFuelCan'tMeltSteelBeams",
        "Password123",
      ];

      function setRandomPasswordPhrase() {
        const passwordField = document.getElementById('password');
        if (!passwordField) return;
        const choice = passwordPhrases[Math.floor(Math.random() * passwordPhrases.length)];
        passwordField.value = choice;
      }

      // Pick one phrase when the page loads
      setRandomPasswordPhrase();

      function setViewportHeight() {
        // Calculate 1% of the viewport height
        const vh = window.innerHeight * 0.01;
        // Set a custom property on the root
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }

      // Set on load
      window.addEventListener('load', setViewportHeight);
      // Update on resize/orientation change
      window.addEventListener('resize', setViewportHeight);

      function updateMenuClock() {
        const clockEl = document.getElementById('menuClock');
        if (!clockEl) return;
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        if (hours === 0) hours = 12;
        clockEl.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
      }

      updateMenuClock();
      setInterval(updateMenuClock, 1000);

      function showGallery() {
        // Fade out the entire page
        document.body.style.opacity = "0";

        setTimeout(() => {
          // Lazy-load images
          const images = document.querySelectorAll("img[data-src]");
          images.forEach((img) => {
            if (!img.src) {
              img.src = img.dataset.src;
            }
          });

          // Switch layout
          document.body.classList.add("gallery-view");

          // Fade page back in
          document.body.style.opacity = "1";
        }, 300);
      }
    </script>
  </body>
</html>
